name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx vsce package -o extension.vsix
      # Trusted publishing: the Marketplace policy and the Open VSX trusted publisher
      # must name this repo and publish.yml
      - run: npx vsce publish --oidc -i extension.vsix
      - run: npx ovsx publish extension.vsix --trusted-publishing
