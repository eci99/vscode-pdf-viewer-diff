name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for the GitHub release
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx vsce package
      # Trusted publishing: the Marketplace policy and the Open VSX trusted publisher
      # must name this repo and publish.yml
      - run: npx vsce publish --oidc -i *.vsix
      - run: npx ovsx publish *.vsix --trusted-publishing
      # The release notes are the section of this version in CHANGELOG.md.
      - run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{if(f)exit; if(index($0,"## " v " ")==1){f=1;next}} f' CHANGELOG.md | sed '/./,$!d' > notes.md
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
